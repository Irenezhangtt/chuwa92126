name: Update submissions table

on:
  # pull_request_target runs in the base repo, so it can push even for PRs from forks.
  # It never checks out PR code; only the PR metadata is read through the API.
  pull_request_target:
    types: [opened, reopened, closed, edited]
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: submissions-table
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Build table
        run: python3 .github/scripts/hwcal.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "Table unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update submissions table"
          git push
